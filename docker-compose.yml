# Single-node Kafka (KRaft mode, no Zookeeper) for the compliance-assistant
# audit/streaming bus (see streaming_pipeline.py and producer.py).
#
# Producer/consumer clients default to localhost:9092 (KAFKA_BOOTSTRAP in
# .env.example). Inside the compose network, brokers are reachable as
# kafka:29092.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: compliance-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: lQHk6Wy/RQSWIbhxxsHqgw==
